<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login | SIPIRS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="container-fluid">

<div class="row vh-100">

<!-- KIRI -->

<div class="col-lg-7 login-left d-none d-lg-flex">

<div class="overlay"></div>

<div class="hero-text">

<h1>SIPIRS</h1>

<h3>Sistem Informasi Publikasi RSUP Surabaya</h3>

<div class="hero-line"></div>
  
<p>

Mendokumentasikan publikasi ilmiah
untuk mendukung inovasi pelayanan kesehatan.

</p>

</div>

</div>

<!-- KANAN -->

<div class="col-lg-5 d-flex justify-content-center align-items-center bg-light">

<div class="login-box shadow">

<div class="text-center">

<img src="../assets/logo-rsup.png"
height="110">

<h2 class="mt-3">

Selamat Datang

</h2>

<p class="text-muted">

Silakan login menggunakan akun SIPIRS

</p>

</div>

<form id="loginForm">

<div class="mb-3">

<label>Email</label>

<input
type="email"
id="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
id="password"
class="form-control"
required>

</div>

<div class="form-check mb-4">

    <input
        class="form-check-input"
        type="checkbox"
        id="rememberMe">

    <label
        class="form-check-label"
        for="rememberMe">

        Ingat Saya

    </label>

</div>

<button
class="btn btn-kemenkes w-100">

Masuk

</button>

</form>

<hr>

<div class="text-center">

Belum memiliki akun?

<a href="register.html">

Daftar

</a>

</div>

<a
href="../index.html"
class="btn btn-outline-secondary mt-4 w-100">

← Kembali ke Homepage

</a>

</div>

</div>

</div>

</div>

<script src="../js/login.js"></script>
  
</body>

</html>
