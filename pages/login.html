<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login | SIPIRS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="../css/style.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="login-page">

<div class="container">

<div class="row justify-content-center align-items-center min-vh-100">

<div class="col-lg-5">

<div class="card login-card shadow">

<div class="card-body p-5">

<div class="text-center mb-4">

<img src="../assets/logo-rsup.png"
height="80">

<h2 class="mt-3 fw-bold text-success">

SIPIRS

</h2>

<p class="text-muted">

Sistem Informasi Publikasi

RSUP Surabaya

</p>

</div>

<form id="loginForm">

<div class="mb-3">

<label>Email</label>

<input
type="email"
id="email"
class="form-control"
placeholder="nama@email.com"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
id="password"
class="form-control"
placeholder="Masukkan password"
required>

</div>

<div class="d-grid">

<button
class="btn btn-kemenkes">

<i class="bi bi-box-arrow-in-right"></i>

Masuk

</button>

</div>

</form>

<hr>

<p class="text-center">

Belum punya akun?

<a href="register.html">

Daftar

</a>

</p>

<a
href="../index.html"
class="btn btn-outline-secondary w-100">

← Kembali ke Homepage

</a>

</div>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
