<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Publikasi | SIPIRS</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

<style>

.page-title {
    font-weight: 700;
    color: #0F172A;
}

.page-subtitle {
    color: #64748B;
}

.publication-card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 4px 12px rgba(0,0,0,.06);
}

.table th {
    white-space: nowrap;
    font-size: 14px;
}

.table td {
    vertical-align: middle;
}

.judul-publikasi {
    font-weight: 600;
    color: #0F172A;
    min-width: 280px;
}

.badge-status {
    border-radius: 8px;
    padding: 6px 10px;
}

</style>

</head>


<body>

<div class="d-flex">


<!-- =========================================
     SIDEBAR
========================================= -->

<div class="sidebar">

    <h3 class="text-white text-center mb-4">
        SIPIRS
    </h3>


    <a href="dashboard.html">

        <i class="bi bi-house-door"></i>

        Dashboard

    </a>


    <a href="publication.html">

        <i class="bi bi-file-earmark-text"></i>

        Publikasi

    </a>


    <a href="add-publication.html">

        <i class="bi bi-plus-circle"></i>

        Tambah Publikasi

    </a>


    <a href="#">

        <i class="bi bi-person"></i>

        Profil

    </a>


    <a href="#">

        <i class="bi bi-bar-chart"></i>

        Statistik

    </a>


    <a href="#" onclick="logout()">

        <i class="bi bi-box-arrow-right"></i>

        Logout

    </a>

</div>


<!-- =========================================
     CONTENT
========================================= -->

<div class="content">


    <!-- TOPBAR -->

    <div class="topbar">

        <h4>

            <i class="bi bi-file-earmark-text me-2"></i>

            Publikasi

        </h4>


        <div id="userName"></div>

    </div>



    <!-- =========================================
         MAIN CONTENT
    ========================================= -->

    <div class="container-fluid px-4 py-4">


        <!-- TITLE -->

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="page-title">
                    Daftar Publikasi
                </h2>

                <p class="page-subtitle mb-0">

                    Daftar publikasi ilmiah yang telah
                    terdaftar di SIPIRS.

                </p>

            </div>


            <a
                href="add-publication.html"
                class="btn btn-kemenkes">

                <i class="bi bi-plus-circle me-1"></i>

                Tambah Publikasi

            </a>

        </div>



        <!-- =========================================
             PUBLICATION CARD
        ========================================= -->

        <div class="publication-card">


            <!-- SEARCH -->

            <div class="row g-3 mb-4">


                <div class="col-md-6">

                    <label class="form-label fw-semibold">

                        Cari Publikasi

                    </label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-search"></i>

                        </span>

                        <input
                            type="text"
                            class="form-control"
                            id="searchPublication"
                            placeholder="Cari judul, jurnal, DOI...">

                    </div>

                </div>



                <!-- FILTER TAHUN -->

                <div class="col-md-3">

                    <label class="form-label fw-semibold">

                        Tahun

                    </label>

                    <select
                        class="form-select"
                        id="filterTahun">

                        <option value="">
                            Semua Tahun
                        </option>

                    </select>

                </div>



                <!-- FILTER INDEXING -->

                <div class="col-md-3">

                    <label class="form-label fw-semibold">

                        Indexing

                    </label>

                    <select
                        class="form-select"
                        id="filterIndexing">

                        <option value="">
                            Semua Indexing
                        </option>

                    </select>

                </div>

            </div>



            <!-- =========================================
                 TABLE
            ========================================= -->

            <div class="table-responsive">

                <table
                    class="table table-hover align-middle">

                    <thead>

                        <tr>

                            <th>
                                No
                            </th>

                            <th>
                                Judul Publikasi
                            </th>

                            <th>
                                Jenis
                            </th>

                            <th>
                                Jurnal / Penerbit
                            </th>

                            <th>
                                Tahun
                            </th>

                            <th>
                                Indexing
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Aksi
                            </th>

                        </tr>

                    </thead>


                    <tbody id="publicationTableBody">

                        <!-- Data akan dimuat dari Google Sheets -->

                        <tr>

                            <td
                                colspan="8"
                                class="text-center text-muted py-5">

                                <i
                                    class="bi bi-hourglass-split me-2">
                                </i>

                                Memuat data publikasi...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>



            <!-- TOTAL DATA -->

            <div class="d-flex justify-content-between mt-3">

                <small class="text-muted">

                    Total publikasi:

                    <strong id="totalPublication">
                        0
                    </strong>

                </small>

            </div>


        </div>

    </div>

</div>

</div>


<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Nanti kita buat -->
<script src="../js/publication.js"></script>


</body>

</html>
