<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tambah Publikasi | SIPIRS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

<div class="d-flex">

<div class="sidebar">

<h3 class="text-white text-center mb-4">
SIPIRS
</h3>

<a href="dashboard.html">
<i class="bi bi-house-door"></i>
Dashboard
</a>

<a href="#">
<i class="bi bi-file-earmark-text"></i>
Publikasi
</a>

<a class="active" href="#">
<i class="bi bi-plus-circle"></i>
Tambah Publikasi
</a>

<a href="#">
<i class="bi bi-person"></i>
Profil
</a>

<a href="#">
<i class="bi bi-bar-chart"></i>
Statistik
</a>

<a href="#" onclick="logout()">
<i class="bi bi-box-arrow-right"></i>
Logout
</a>

</div>

<div class="content">

<div class="topbar">

<h4>Tambah Publikasi</h4>

</div>

<div class="container py-4">

<div class="card shadow border-0 rounded-4">

<div class="card-body p-4">

<h4 class="mb-4">

Informasi Publikasi

</h4>

<form id="publicationForm">

<div class="mb-3">

<label class="form-label">

Judul Publikasi

</label>

<input
type="text"
class="form-control"
id="judul"
required>

</div>

<div class="row">

<div class="col-md-6">

<label class="form-label">

Jenis Publikasi

</label>

<select
id="jenis"
class="form-select">

<option>Artikel Jurnal</option>

<option>Prosiding</option>

<option>Buku</option>

<option>Book Chapter</option>

</select>

</div>

<div class="col-md-6">

<label class="form-label">

Tahun

</label>

<input
type="number"
id="tahun"
class="form-control"
value="2026">

</div>

</div>

<div class="mt-3">

<label class="form-label">

Nama Jurnal

</label>

<input
type="text"
id="jurnal"
class="form-control">

</div>

<div class="row mt-3">

<div class="col-md-6">

<label class="form-label">

DOI

</label>

<input
type="text"
id="doi"
class="form-control">

</div>

<div class="col-md-6">

<label class="form-label">

URL

</label>

<input
type="url"
id="url"
class="form-control">

</div>

</div>

<div class="mt-3">

<label class="form-label">

Status

</label>

<select
id="status"
class="form-select">

<option>Draft</option>

<option>Submitted</option>

<option>Accepted</option>

<option>Published</option>

</select>

</div>

<div class="mt-3">

<label class="form-label">

Abstrak

</label>

<textarea
id="abstrak"
class="form-control"
rows="6"></textarea>

</div>

<div class="mt-4">

<button
class="btn btn-kemenkes">

<i class="bi bi-check-circle"></i>

Simpan

</button>

<button
type="reset"
class="btn btn-outline-secondary">

Reset

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

<script src="../js/add-publication.js"></script>
  
</body>

</html>
