<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Registrasi | SIPIRS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="container-fluid">

<div class="row vh-100">

<!-- ===========================
KIRI
=========================== -->

<div class="col-lg-7 login-left d-none d-lg-flex">

    <div class="overlay"></div>

    <div class="hero-text">

        <h1>SIPIRS</h1>

        <h3>
            Sistem Informasi Publikasi
            RSUP Surabaya
        </h3>

        <div class="hero-line"></div>

        <p>

            Mendokumentasikan publikasi ilmiah
            untuk mendukung inovasi pelayanan,
            pendidikan, dan penelitian.

        </p>

    </div>

</div>

<!-- ===========================
KANAN
=========================== -->

<div class="col-lg-5 d-flex justify-content-center align-items-center bg-light">

<div class="login-box shadow">

<div class="text-center">

<img
src="../assets/logo-rsup.png"
height="110">

<h2 class="mt-3">

Registrasi SIPIRS

</h2>

<p class="text-muted">

Silakan lengkapi data berikut
untuk membuat akun SIPIRS

</p>

</div>

<h2 class="text-center mb-4">

Registrasi SIPIRS

</h2>

<form id="registerForm">

<div class="mb-3">

<label class="form-label">
  Nama Lengkap
  <span class="text-danger">*</span>
</label>

<input
type="text"
id="namaLengkap"
class="form-control"
required>

</div>

<div class="row">

<div class="col-md-6">

<div class="mb-3">

<label class="form-label">
NIP
<span class="text-danger">*</span>  
</label>

<input
type="text"
id="nip"
class="form-control"
maxlength="18"
required>

</div>

</div>

<div class="col-md-6">

<div class="mb-3">

<label class="form-label">
No.HP
<span class="text-danger">*</span>
</label>

<input
type="text"
id="nomorHP"
class="form-control"
required>

</div>

</div>

</div>

<div class="mb-3">

<label class="form-label">
Email
<span class=text-danger">*</span>
</label>

<input
type="email"
id="email"
class="form-control"
required>

</div>

<div class="col-md-6">

    <div class="mb-3">

        <label class="form-label">
            Password
            <span class="text-danger">*</span>
        </label>

        <div class="input-group">

            <input
                type="password"
                id="password"
                class="form-control"
                required>

            <button
                class="btn btn-outline-secondary"
                type="button"
                id="togglePassword">

                <i class="bi bi-eye"></i>

            </button>

        </div>

    </div>

</div>

<div class="col-md-6">

    <div class="mb-3">

        <label class="form-label">
            Konfirmasi Password
            <span class="text-danger">*</span>
        </label>

        <div class="input-group">

            <input
                type="password"
                id="confirmPassword"
                class="form-control"
                required>

            <button
                class="btn btn-outline-secondary"
                type="button"
                id="toggleConfirmPassword">

                <i class="bi bi-eye"></i>

            </button>

        </div>
      
    <div
        id="passwordWarning"
        class="form-text text-danger d-none">
    </div>
    </div>

</div>

<div class="mb-3">

<label class="form-label">
    Departemen
    <span class="text-danger">*</span>
</label>

<select
id="departemenID"
class="form-select"
required>

<option value="">Pilih Departemen</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
    Jabatan
    <span class="text-danger">*</span>
</label>

<select
id="jabatanID"
class="form-select"
required>

<option value="">Pilih Jabatan</option>

</select>

</div>

<button
  id="btnRegister"
  type="submit"
  class="btn btn-success w-100">

Daftar

</button>

</form>

<hr>

<div class="text-center">

Sudah memiliki akun?

<a href="login.html">

Masuk

</a>

</div>

<a
href="../index.html"
class="btn btn-outline-secondary mt-4 w-100">

← Kembali ke Homepage

</a>

</div>

</div>

</div>

</div>

</div>

<script src="../js/config.js"></script>
<script src="../js/register.js"></script>

</body>

</html>
