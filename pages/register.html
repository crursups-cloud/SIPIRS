<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Registrasi | SIPIRS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

</head>

<body class="bg-light">

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow">

<div class="card-body p-5">

<h2 class="text-center mb-4">

Registrasi SIPIRS

</h2>

<form id="registerForm">

<div class="mb-3">

<label>Nama Lengkap</label>

<input
type="text"
id="namaLengkap"
class="form-control"
required>

</div>

<div class="row">

<div class="col-md-6">

<div class="mb-3">

<label>NIP</label>

<input
type="text"
id="nip"
class="form-control"
maxlength="18"
required>

</div>

</div>

<div class="col-md-6">

<div class="mb-3">

<label>No HP</label>

<input
type="text"
id="nomorHP"
class="form-control">

</div>

</div>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
id="email"
class="form-control"
required>

</div>

<div class="row">

<div class="col-md-6">

<div class="mb-3">

<label>Password</label>

<input
type="password"
id="password"
class="form-control"
required>

</div>

</div>

<div class="col-md-6">

<div class="mb-3">

<label>Konfirmasi Password</label>

<input
type="password"
id="confirmPassword"
class="form-control"
required>

</div>

</div>

</div>

<div class="mb-3">

<label>Departemen</label>

<select
id="departemenID"
class="form-select"
required>

<option value="">Pilih Departemen</option>

</select>

</div>

<div class="mb-3">

<label>Jabatan</label>

<select
id="jabatanID"
class="form-select"
required>

<option value="">Pilih Jabatan</option>

</select>

</div>

<div class="mb-4">

<label>ORCID (opsional)</label>

<input
type="text"
id="orcid"
class="form-control">

</div>

<button
class="btn btn-success w-100">

Daftar

</button>

</form>

<hr>

<div class="text-center">

Sudah punya akun?

<a href="login.html">

Login

</a>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="../js/config.js"></script>
<script src="../js/register.js"></script>

</body>

</html>
