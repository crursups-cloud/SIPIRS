<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Register | SIPIRS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="container-fluid">

<div class="row vh-100">

<!-- KIRI -->

<div class="col-lg-7 login-left d-none d-lg-flex">

<div class="overlay"></div>

<div class="hero-text">

<h1>SIPIRS</h1>

<h3>Sistem Informasi Publikasi RSUP Surabaya</h3>

<div class="hero-line"></div>

<p>
Daftarkan akun SIPIRS untuk mulai mengelola publikasi ilmiah.
</p>

</div>

</div>

<!-- KANAN -->

<div class="col-lg-5 d-flex justify-content-center align-items-center bg-light">

<div class="login-box shadow">

<div class="text-center mb-4">

<img src="../assets/logo-rsup.png" height="100">

<h2 class="mt-3">

Daftar Akun

</h2>

<p class="text-muted">

Silakan lengkapi data berikut

</p>

</div>

<form id="registerForm">

<div class="mb-3">

<label>Nama Lengkap</label>

<input
type="text"
id="nama"
class="form-control"
required>

</div>

<div class="mb-3">

<label>NIP / NIK</label>

<input
type="text"
id="nip"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
id="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Unit Organisasi</label>

<select
id="unit"
class="form-select"
required>

<option value="">Pilih Unit</option>

</select>

</div>

<div class="mb-3">

<label>Jabatan</label>

<select
id="jabatan"
class="form-select"
required>

<option value="">Pilih Jabatan</option>

</select>

</div>

<div class="mb-3">

<label>Nomor HP</label>

<input
type="text"
id="hp"
class="form-control">

</div>

<div class="mb-3">

<label>ORCID (Opsional)</label>

<input
type="text"
id="orcid"
class="form-control">

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
id="password"
class="form-control"
required>

</div>

<div class="mb-4">

<label>Konfirmasi Password</label>

<input
type="password"
id="confirmPassword"
class="form-control"
required>

</div>

<button
type="submit"
class="btn btn-kemenkes w-100">

Daftar

</button>

</form>

<hr>

<div class="text-center">

Sudah punya akun?

<a href="login.html">

Masuk

</a>

</div>

<a
href="../index.html"
class="btn btn-outline-secondary mt-4 w-100">

← Kembali ke Homepage

</a>

</div>

</div>

</div>

</div>

<script src="../js/config.js"></script>
<script src="../js/register.js"></script>

</body>

</html>
